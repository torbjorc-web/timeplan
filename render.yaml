services:
  - type: web
    name: timeplan
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    # --include=dev er nødvendig fordi NODE_ENV=production (satt under) ellers får
    # npm ci til å hoppe over devDependencies - der byggeverktøyet (typescript) ligger.
    # Frontend bygges/serves IKKE lenger her - den kjører på Netlify (se netlify.toml). Denne
    # tjenesten er kun API-et.
    buildCommand: npm ci --prefix server --include=dev && npm run build --prefix server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/helse
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # Netlify-URLen til frontend, f.eks. https://timeplan.netlify.app - brukes til CORS og Stripe-redirects.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRIS_ID
        sync: false
    # NB: Gratis Render-instanser har IKKE persistent disk - server/data/*.json
    # nullstilles ved hver redeploy/restart. For ekte persistens (anbefalt før
    # reell bruk, se README "JSON-fillagring"), oppgrader til et betalt plan og
    # legg til en disk her, f.eks.:
    # disk:
    #   name: timeplan-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
